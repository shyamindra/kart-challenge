# docker-compose.yaml

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kart-backend
    ports:
      - "8080:8080"
    networks:
      - kart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kart-frontend
    ports:
      - "3000:80" # Map host port 3000 to container port 80 (Nginx)
    depends_on:
      - backend
    environment:
      # This is crucial for the Vite build process to know the API location.
      # The frontend will make requests to 'http://backend:8080' inside the Docker network.
      - VITE_API_BASE_URL=http://backend:8080
    networks:
      - kart-network

networks:
  kart-network:
    driver: bridge